# Wall follow node parameters
# Run: ros2 run wall_follow wall_follow_node --ros-args --params-file src/wall_follow/config/params.yaml
# /** applies params to the node regardless of name/namespace

/**:
  ros__parameters:
    params_file: "config/params.yaml"
    kp: 0.9
    kd: 0.5
    ki: 0.01

    # Wall follow geometry
    desired_distance: 1.0      # m, target distance to wall
    lookahead: 1.0              # m, for future_dist projection
    theta: 0.7853981633974483   # rad, 45 deg, angle between two lidar rays (a and b)

    # Integral: use last K timesteps
    pid_num_steps: 10           # max number of past steps for I (and for D window)
    pid_max_seconds: 5.0         # ignore data older than this (seconds) for I and D

    # Steering output
    steering_clamp: 0.4          # rad, symmetric clamp ± (e.g. ±0.4 rad)

    # Error history queue
    max_error_history: 100

    # Speed by steering (angle in degrees)
    speed_straight: 5.0        # when |steering_deg| < angle_deg_medium
    speed_medium: 3.0         # when angle_deg_medium <= |steering_deg| < angle_deg_tight
    speed_tight: 0.5            # when |steering_deg| >= angle_deg_tight
    angle_deg_medium: 10.0
    angle_deg_tight: 20.0

    # Topics (optional overrides)
    lidarscan_topic: "/scan"
    drive_topic: "/drive"
    log_topic: "/wall_follow_log"
